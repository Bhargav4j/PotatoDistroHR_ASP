version: '3.8'

services:
  potatodistrohr-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: potatodistrohr-web:latest
    container_name: potatodistrohr-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DB_HOST=${DB_HOST:-localhost}
      - DB_NAME=${DB_NAME:-potatodistrohr}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_CONNECTION_STRING=${REDIS_CONNECTION_STRING:-}
    volumes:
      - ./logs:/app/logs
      - ./appsettings:/app/appsettings
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  appsettings: